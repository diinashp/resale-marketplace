databaseChangeLog:
  - changeSet:
      id: 001-create-listing-and-reservation-tables
      author: dshpakova
      changes:
        - createTable:
            tableName: listing
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: seller_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: price
                  type: NUMERIC(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

        - sql:
            sql: "ALTER TABLE listing ADD CONSTRAINT chk_listing_title_not_blank CHECK (length(trim(title)) > 0)"

        - sql:
            sql: "ALTER TABLE listing ADD CONSTRAINT chk_listing_price_non_negative CHECK (price >= 0)"

        - sql:
            sql: "ALTER TABLE listing ADD CONSTRAINT chk_listing_status CHECK (status IN ('AVAILABLE', 'RESERVED', 'SOLD'))"

        - createTable:
            tableName: reservation
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: listing_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: buyer_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: seller_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: listing_id
            constraintName: fk_reservation_listing
            referencedTableName: listing
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: "ALTER TABLE reservation ADD CONSTRAINT chk_reservation_status CHECK (status IN ('ACTIVE', 'CANCELLED', 'COMPLETED'))"

        - sql:
            sql: "ALTER TABLE reservation ADD CONSTRAINT chk_reservation_buyer_not_seller CHECK (buyer_id <> seller_id)"

        - createIndex:
            tableName: listing
            indexName: idx_listing_seller_status
            columns:
              - column:
                  name: seller_id
              - column:
                  name: status

        - createIndex:
            tableName: reservation
            indexName: idx_reservation_buyer_id
            columns:
              - column:
                  name: buyer_id

        - createIndex:
            tableName: reservation
            indexName: idx_reservation_seller_id
            columns:
              - column:
                  name: seller_id